name: Generate Spider Path

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: AMITH2529
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23E23636&color_dots=%230D1117,%230d1b2a,%231b263b,%23415a77,%230051C8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
