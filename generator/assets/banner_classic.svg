<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="50%" stop-color="#07080f" />
      <stop offset="100%" stop-color="#14061a" />
    </linearGradient>

    <!-- Spidey Red Glow Gradient -->
    <radialGradient id="red-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0" />
    </radialGradient>

    <!-- Spidey Blue Glow Gradient -->
    <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome Text / Metallic Fill -->
    <linearGradient id="text-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#b0b0b0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="350" fill="url(#bg-grad)" />

  <!-- Ambient Glow Effects -->
  <circle cx="850" cy="175" r="300" fill="url(#red-glow)" />
  <circle cx="150" cy="175" r="300" fill="url(#blue-glow)" />

  <!-- Cyber Web Network (Data Science / Spidey Theme) -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <!-- Spider Web Lines radiating from top-right -->
    <line x1="1000" y1="0" x2="0" y2="150" />
    <line x1="1000" y1="0" x2="300" y2="350" />
    <line x1="1000" y1="0" x2="600" y2="350" />
    <line x1="1000" y1="0" x2="0" y2="300" />
    <line x1="1000" y1="0" x2="0" y2="0" />
    
    <!-- Concentric Web Rings -->
    <path d="M 800,0 A 200,200 0 0,0 1000,200" fill="none" />
    <path d="M 600,0 A 400,400 0 0,0 1000,400" fill="none" />
    <path d="M 400,0 A 600,600 0 0,0 1000,600" fill="none" />
    <path d="M 200,0 A 800,800 0 0,0 1000,800" fill="none" />
  </g>

  <!-- Left Side Spider Web radiating from center-left -->
  <g stroke="#ff3366" stroke-opacity="0.08" stroke-width="1.2">
    <line x1="0" y1="175" x2="1000" y2="175" />
    <line x1="0" y1="175" x2="700" y2="0" />
    <line x1="0" y1="175" x2="700" y2="350" />
    <line x1="0" y1="175" x2="400" y2="0" />
    <line x1="0" y1="175" x2="400" y2="350" />
    
    <!-- Concentric Circles for Left Web -->
    <circle cx="0" cy="175" r="100" fill="none" />
    <circle cx="0" cy="175" r="220" fill="none" />
    <circle cx="0" cy="175" r="350" fill="none" />
    <circle cx="0" cy="175" r="500" fill="none" />
  </g>

  <!-- Diagonal Tech Data Grid Overlay -->
  <g stroke="#0066ff" stroke-opacity="0.1" stroke-width="0.5">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" />
      <path d="M 20 0 L 0 0 0 20" fill="none" />
    </pattern>
    <rect width="1000" height="350" fill="url(#grid)" />
  </g>

  <!-- Glowing Spider Emblem Backdrop (Huge subtle silhouette) -->
  <path d="M 850,110 L 870,140 L 890,110 L 880,175 L 890,200 L 865,190 L 850,225 L 835,190 L 810,200 L 820,175 Z" 
        fill="#ff3366" fill-opacity="0.05" filter="url(#glow-red)" />

  <!-- Spider-Sense Electric Rays -->
  <path d="M 120,60 Q 140,50 160,55 M 115,50 Q 135,35 155,42 M 110,40 Q 130,20 150,30" 
        fill="none" stroke="#ff3366" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-red)" stroke-opacity="0.8" />
  
  <path d="M 80,60 Q 60,50 40,55 M 85,50 Q 65,35 45,42 M 90,40 Q 70,20 50,30" 
        fill="none" stroke="#ff3366" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-red)" stroke-opacity="0.8" />

  <!-- The Iconic Spider-Man Eyes logo (Left Side) -->
  <g transform="translate(70, 70)" filter="url(#glow-blue)">
    <!-- Outer Black Frame -->
    <path d="M 5,25 C 10,5 25,-10 65,10 C 65,10 70,40 50,55 C 30,70 10,75 5,25 Z" fill="#111" stroke="#ff3366" stroke-width="3" />
    <path d="M 115,25 C 110,5 95,-10 55,10 C 55,10 50,40 70,55 C 90,70 110,75 115,25 Z" fill="#111" stroke="#ff3366" stroke-width="3" />
    <!-- Inner White Glowing Eyes -->
    <path d="M 10,23 C 15,7 28,-5 60,12 C 58,25 55,42 45,48 C 32,58 15,60 10,23 Z" fill="#ffffff" />
    <path d="M 110,23 C 105,7 92,-5 60,12 C 62,25 65,42 75,48 C 88,58 105,60 110,23 Z" fill="#ffffff" />
  </g>

  <!-- Center-Right Logo: High Tech Spider Emblem -->
  <g transform="translate(800, 110)" filter="url(#glow-red)">
    <!-- Head -->
    <ellipse cx="50" cy="20" rx="7" ry="8" fill="#ff3366" />
    <!-- Body -->
    <ellipse cx="50" cy="50" rx="12" ry="24" fill="#ff3366" />
    
    <!-- Legs (Left) -->
    <path d="M 45,35 Q 20,25 15,10" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 43,45 Q 15,40 10,30" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 43,55 Q 12,65 15,85" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 45,65 Q 22,80 25,100" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Legs (Right) -->
    <path d="M 55,35 Q 80,25 85,10" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 57,45 Q 85,40 90,30" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 57,55 Q 88,65 85,85" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 55,65 Q 78,80 75,100" fill="none" stroke="#ff3366" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Profile Text Content (Centered/Left Aligned) -->
  <g transform="translate(230, 0)">
    <!-- Main Title (Name) -->
    <text x="0" y="145" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#text-metal)" 
          filter="url(#glow-blue)">AMITH</text>
    
    <!-- Subtle Web Attachment Lines to text -->
    <line x1="-20" y1="130" x2="220" y2="130" stroke="#0066ff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Role/Title -->
    <text x="0" y="195" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="24" 
          font-weight="700" 
          letter-spacing="2" 
          fill="#ff3366" 
          filter="url(#glow-red)">FRIENDLY NEIGHBORHOOD AI ENGINEER</text>

    <!-- Slogan / Subtitle -->
    <text x="0" y="240" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="16" 
          font-weight="500" 
          font-style="italic"
          letter-spacing="1" 
          fill="#8e9bb0">"With great data comes great responsibility."</text>

    <!-- Interactive Badges/Stats inside Banner -->
    <g transform="translate(0, 275)">
      <!-- AI Badge -->
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#0066ff" fill-opacity="0.2" stroke="#0066ff" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#00f5ff" />
      <text x="30" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">AGENTIC AI</text>
      
      <!-- Python/ML Badge -->
      <rect x="125" y="0" width="145" height="26" rx="13" fill="#ff3366" fill-opacity="0.2" stroke="#ff3366" stroke-width="1" />
      <circle cx="140" cy="13" r="4" fill="#ff3366" />
      <text x="155" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">DATA SCIENCE &amp; ML</text>
      
      <!-- Multiverse Badge -->
      <rect x="285" y="0" width="130" height="26" rx="13" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
      <circle cx="300" cy="13" r="4" fill="#e0e0e0" />
      <text x="315" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e0e0e0" letter-spacing="0.5">AIML STUDENT</text>
    </g>
  </g>

</svg>
